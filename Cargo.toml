[workspace]
members = [
    "rfamily-core",
    "rfamily-cli",
    "rfamily-common",
    "rfamily-web",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
rand = "0.8"
rand_distr = "0.5"
