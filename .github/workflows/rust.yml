name: Rust CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Run tests
      run: cargo test --verbose

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        components: clippy
    - name: Run clippy
      run: cargo clippy -- -D warnings

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Run performance tests
      run: cargo test -p rfamily-core --test performance_tests --release -- --test-threads=1 --nocapture
    - name: Run quick benchmarks (parser)
      run: cargo bench -p rfamily-core --bench parser_bench -- --sample-size 10 --warm-up-time 1 --measurement-time 3
    - name: Run quick benchmarks (generator)
      run: cargo bench -p rfamily-core --bench generator_bench -- --sample-size 10 --warm-up-time 1 --measurement-time 3
    - name: Run quick benchmarks (IOUS)
      run: cargo bench -p rfamily-core --bench ious_bench -- --sample-size 10 --warm-up-time 1 --measurement-time 3

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Install cargo-deny
      run: cargo install --locked cargo-deny
    - name: Run cargo-deny
      run: cargo deny check advisories
    - name: Run cargo audit
      run: |
        cargo install cargo-audit
        cargo audit

  build:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v6
    - uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: Build release
      run: cargo build --release --verbose
